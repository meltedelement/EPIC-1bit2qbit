[network]
external_host = "https://1bit2qbit.theburkenator.com"
vm_address    = "200.69.13.70"

[services.backend]
internal_port = 8000
host          = "127.0.0.1"

# MySQL via Unix socket auth — no password, OS-level auth.
# Socket path is the Ubuntu default; the API only runs on the team VM.
[services.backend.db]
url = "mysql+pymysql://student@/epic?unix_socket=/var/run/mysqld/mysqld.sock"

[messaging]
edit_window_minutes       = 2
edit_grace_seconds        = 10
clock_skew_grace_seconds  = 10
message_ttl_days    = 30
ttl_cleanup_interval_hours = 1

[blockchain]
batch_interval_minutes = 5

[rate_limiting]
register_limit               = 5
register_window_seconds      = 60
ws_auth_fail_limit           = 10
ws_auth_fail_window_seconds  = 900

[logging.stdout]
enabled     = true
level       = "DEBUG"
format      = "%(log_color)s%(levelname)-8s%(reset)s %(asctime)s %(name)s — %(message)s"
date_format = "%H:%M:%S"

[logging.file]
enabled        = true
level          = "DEBUG"
directory      = "logs"
retention_days = 7
format         = "%(asctime)s %(levelname)-8s %(name)s — %(message)s"
date_format    = "%Y-%m-%d %H:%M:%S"
