# Handle WebSocket Upgrade header for the /backend/ws endpoint
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    server_name 1bit2qbit.theburkenator.com;

    # TLS terminates at the university gateway upstream — traffic from the gateway
    # to this VM is plain HTTP on port 80 by design. HTTPS is enforced and certs
    # are managed at the gateway (Let's Encrypt). Do not configure SSL here.

    # Security headers — applied to all responses via inheritance.
    # IMPORTANT: any location that defines its own add_header directive must also
    # repeat these, because nginx's add_header does not inherit when a child block
    # has its own add_header directives.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"      always;
    add_header X-Frame-Options           "SAMEORIGIN"                               always;
    add_header X-Content-Type-Options    "nosniff"                                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"          always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups"               always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://eth-sepolia.g.alchemy.com https://ethereum-sepolia-rpc.publicnode.com; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    # /  — Project report PDF
    # Repeats security headers because this block has its own add_header.
    location = / {
        root /home/student/EPIC-1bit2qbit/docs;
        try_files /report.pdf =404;
        add_header Content-Type              application/pdf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"      always;
        add_header X-Frame-Options           "SAMEORIGIN"                               always;
        add_header X-Content-Type-Options    "nosniff"                                  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"          always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups"               always;
        add_header Content-Security-Policy   "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
    }

    # Probely security scanner domain verification file (temporary)
    location = /bf27534f-d5b4-4863-8963-c407449e5838.txt {
        root /home/student/EPIC-1bit2qbit;
    }

    # /verify  — Blockchain verification React SPA (built with Vite)
    location = /verify {
        return 301 /verify/;
    }

    location /verify/ {
        access_log /var/log/nginx/verify.access.log;
        error_log  /var/log/nginx/verify.error.log;
        alias /home/student/EPIC-1bit2qbit/server/web-app/dist/;
        try_files $uri $uri/ /verify/index.html;
    }

    # /backend  — FastAPI message-routing & key-bundle management API
    location /backend/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        # WebSocket upgrade support (required for the /ws endpoint)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        # Hardcoded https — $scheme would always be "http" since TLS terminates upstream
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header X-Forwarded-Prefix /backend;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
